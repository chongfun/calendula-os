[package]
name = "storage"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[features]
# Off by default so the crate builds and tests on the host. `fw` turns these on:
# `esp-log` routes slog! (errors, boot identity, storage narration) at
# esp-println, and `serial-log` additionally routes bench_log! telemetry, the
# split fw's own `serial-log` feature draws.
esp-log = ["dep:esp-println"]
serial-log = ["esp-log"]
device-x3 = ["display/device-x3", "reader-cache/device-x3"]
bench-selftest = ["upload-store/bench-selftest"]
powercut-selftest = []

[dependencies]
app-core = { path = "../app-core" }
display = { path = "../display" }
ui = { path = "../ui" }
proto = { path = "../proto" }
upload-store = { path = "../upload-store" }
reader-cache = { path = "../reader-cache" }
embedded-sdmmc = { workspace = true }
heapless = "0.9.0"
embassy-time = "0.5.1"
critical-section = "1.2.0"
esp-println = { version = "0.17.0", features = ["esp32c3"], optional = true }

[dev-dependencies]
embassy-time = { version = "0.5.1", features = ["std"] }
critical-section = { version = "1.2.0", features = ["std"] }
fatfs = "0.3.6"
