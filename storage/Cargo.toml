[package]
name = "storage"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[features]
# Off by default so the crate builds and tests on the host. `esp-log` sends
# slog! to the platform-installed line sink; `serial-log` adds bench_log! telemetry, matching fw-c3's
# own `serial-log` feature.
esp-log = []
serial-log = ["esp-log"]
device-x3 = ["display/device-x3", "reader-cache/device-x3"]
bench-selftest = ["upload-store/bench-selftest"]
powercut-selftest = []
touch-ui = ["app-core/touch-ui", "ui/touch-ui", "fw-common/touch-ui"]

[dependencies]
fw-common = { path = "../fw-common" }
app-core = { path = "../app-core" }
display = { path = "../display" }
ui = { path = "../ui" }
proto = { path = "../proto" }
upload-store = { path = "../upload-store" }
reader-cache = { path = "../reader-cache" }
embedded-sdmmc = { workspace = true }
heapless = "0.9.0"
embassy-time = "0.5.1"
critical-section = "1.2.0"

[dev-dependencies]
embassy-time = { version = "0.5.1", features = ["std"] }
critical-section = { version = "1.2.0", features = ["std"] }
fatfs = "0.3.6"
