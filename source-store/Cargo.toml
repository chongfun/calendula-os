[package]
name = "source-store"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
# Body and commit-sector checksums. Same crate proto already compiles for both
# targets; CRC-32/ISO-HDLC here, distinct from ota.rs's bootloader algorithm.
crc = "3.2.1"
heapless = "0.9.0"
# Same pin as fw's, reader-cache's, and upload-store's; see fw/Cargo.toml for
# why this exact rev.
embedded-sdmmc = { git = "https://github.com/rust-embedded-community/embedded-sdmmc-rs.git", rev = "d26892f7405469eba95741763ab39bda2239d5ec", default-features = false }

[dev-dependencies]
# Formats the in-memory FAT image the fault-injection and power-cut replay
# tests run against, the same way reader-cache/tests/publish_faults.rs does.
fatfs = "0.3.6"
