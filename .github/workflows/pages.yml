name: Deploy web emulator to Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tools/verify_web_flasher.sh"
      - "tools/web-emulator/**"
      - "tools/build-web.sh"
      - "app-core/**"
      - "display/**"
      - "ui/**"
      - "proto/**"
      - "fixtures/scenarios/**"
      - "fixtures/golden/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag whose firmware should be published"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          persist-credentials: false
      - name: Install Rust (stable, wasm target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain stable
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build wasm emulators (all boards) and assemble site
        run: ./tools/build-web.sh _site
      # Serve the release the page's Version label names, not Latest. Until
      # that release exists, deploy nothing: the release workflow runs this
      # again with its tag.
      - name: Pick the release this page names
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.release_tag }}
        run: |
          if [ -n "$REQUESTED" ]; then
            echo "tag=$REQUESTED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(sed -n 's|.*<span class="k">Version</span><b>\(v[^<]*\)</b>.*|\1|p' web/index.html | head -n 1)
          if [ -z "$tag" ]; then
            echo "error: no Version label in web/index.html" >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::release $tag is not published yet; the release workflow deploys this page once it is"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
      - name: Download release firmware
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern firmware-x4.bin --pattern firmware-x3.bin \
            --pattern update.bin --pattern update-x3.bin \
            --pattern FWUPDX3.BIN --dir _site
          # Patterns are alternatives: the download succeeds even when one
          # matches nothing. Every same-origin download link on the page must
          # exist, or the deploy would publish a 404 install path.
          for asset in firmware-x4.bin firmware-x3.bin update.bin update-x3.bin; do
            test -f "_site/$asset" || { echo "missing release asset: $asset" >&2; exit 1; }
          done
          tools/verify_web_flasher.sh _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: steps.release.outputs.tag != ''
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.release_tag != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
