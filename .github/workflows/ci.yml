name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Host target for crates that build/test on a plain host (see README's
  # "Development" section). The firmware target (fw, hal-ext) comes from
  # .cargo/config.toml's [build] default and rust-toolchain.toml.
  HOST_TARGET: x86_64-unknown-linux-gnu

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal
      - name: Check fmt
        run: tools/check.sh fmt

  python:
    name: Lint and Test Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      # `.python-version` is the single source for the interpreter, read here
      # and by tools/check.sh, so CI and a bench operator cannot end up on
      # different ones. The harness imports `tomllib` directly, so there is no
      # second version for a budget to be enforced on and skipped against.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      # Pinned to match ruff.toml's `required-version`; ruff exits with the
      # mismatch if the two ever drift apart.
      - name: Install ruff
        run: pipx install ruff==0.16.1
      - name: Lint and format-check Python
        run: tools/check.sh ruff
      # The bench harness produces every device performance number this
      # project has, and its tests ran in no workflow at all until now -- a
      # gate that exists only on whoever remembers it locally is the shape
      # this repo keeps arguing against.
      - name: Test bench harness
        run: tools/check.sh test-bench
      # Same reasoning for the device tooling whose analysis decides a pass
      # or a fail: the powercut campaign reports green on a broken card if
      # its landing logic is wrong, and nobody re-derives that by hand.
      - name: Test device tools
        run: tools/check.sh test-tools

  clippy-firmware:
    name: Lint Firmware (${{ matrix.device }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [x4, x3]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal
      # Each board retains default, no-serial-log, and powercut-selftest checks.
      - name: Check firmware clippy (${{ matrix.device }})
        run: tools/check.sh clippy-firmware "${{ matrix.device }}"

  clippy-host:
    name: Lint Host Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal
      - name: Check host clippy
        run: tools/check.sh clippy-host

  test:
    name: Test Host Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal
      - name: Test host
        run: tools/check.sh test-host
      - name: Test X3 display code
        run: tools/check.sh test-host-x3

  golden-frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal
      - name: Check golden frames
        run: tools/check.sh golden-frames
      # tools/emulator is its own cargo workspace, so the root fmt, clippy,
      # and `cargo test --workspace` never reach it; without this its lints,
      # the reading-page goldens, and the emulator unit tests run in no
      # workflow at all.
      - name: Test emulator (fmt, clippy, reading goldens, unit tests)
        run: tools/check.sh test-emulator

  web-emulator:
    name: Check Web Emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install Rust (stable, wasm target, rustfmt, clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add wasm32-unknown-unknown --toolchain stable
      # Its own cargo workspace, like tools/emulator: the fmt, clippy, and
      # test jobs above never reach it, and the Pages build only proves it
      # compiles.
      - name: Check web emulator (fmt, clippy, tests, both boards)
        run: tools/check.sh web-emulator

  build-firmware:
    name: Build Firmware and Check Stack Frames (${{ matrix.device }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [x4, x3]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      # The stack-frame analyzer uses the pinned Python and LLVM tools.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal
      # Each matrix runner gets an independent target directory, avoiding the
      # two boards overwriting the same fw ELF before the stack-frame check.
      # Retain stack-frame checks on both devices; there is no stack guard.
      - name: Build firmware (release) and check stack frames (${{ matrix.device }})
        run: tools/check.sh stack-frames "${{ matrix.device }}"
