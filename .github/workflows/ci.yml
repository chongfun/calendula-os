name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Host target for crates that build/test on a plain host (see README's
  # "Development" section). The firmware target (fw, hal-ext) comes from
  # .cargo/config.toml's [build] default and rust-toolchain.toml.
  HOST_TARGET: x86_64-unknown-linux-gnu

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install Rust (stable, rustfmt)
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check fmt
        run: tools/check.sh fmt

  python:
    name: Lint and Test Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor `ruff.toml` declares and the interpreter macOS
        # ships, so it is what an operator captures with; 3.14 is a current
        # release, and the only one where `tomllib` exists, so it is the only
        # leg that actually enforces a budget. Running the runner's default
        # python tested neither: it is neither the floor nor pinned, and the
        # 3.9 support the harness carries (the `tomli` fallback, the syntax it
        # avoids) was verified only by hand.
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      # Lint once. ruff is a standalone binary and `target-version` is config,
      # so its verdict does not depend on which python is installed, and the
      # second leg would only repeat it. Pinned to match ruff.toml's
      # `required-version`; ruff exits with the mismatch if the two drift.
      - name: Install ruff
        if: matrix.python-version == '3.14'
        run: pipx install ruff==0.16.1
      - name: Lint and format-check Python
        if: matrix.python-version == '3.14'
        run: tools/check.sh ruff
      # The bench harness produces every device performance number this
      # project has, and its tests ran in no workflow at all until now -- a
      # gate that exists only on whoever remembers it locally is the shape
      # this repo keeps arguing against. Both legs, because the harness
      # supports both and they take different paths through `load_budgets`.
      - name: Test bench harness
        run: tools/check.sh test-bench

  clippy-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install Rust (stable, firmware target, clippy)
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup target add riscv32imc-unknown-none-elf --toolchain stable
      - name: Check firmware clippy
        run: tools/check.sh clippy-firmware

  clippy-host:
    name: Lint Host Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install Rust (stable, clippy)
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Check host clippy
        run: tools/check.sh clippy-host

  test:
    name: Test Host Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal
      - name: Test host
        run: tools/check.sh test-host
      - name: Test X3 display code
        run: tools/check.sh test-host-x3

  golden-frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal
      - name: Check golden frames
        run: tools/check.sh golden-frames
      # tools/emulator is its own cargo workspace, so the root `cargo test
      # --workspace` never reaches it; without these the reading-page goldens
      # and the emulator unit tests run in no workflow at all.
      - name: Test emulator (reading goldens, unit tests)
        run: tools/check.sh test-emulator

  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install Rust (stable, firmware target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add riscv32imc-unknown-none-elf --toolchain stable
          # llvm-objdump/llvm-nm for the stack-frame check below.
          rustup component add llvm-tools --toolchain stable
      # Builds both boards and checks the largest stack frame in each. The
      # device has no stack guard page, so an overflow lands in .bss and
      # surfaces as an unrelated panic; this is the only gate that would catch
      # it before a flash. See tools/stack_frames.py.
      - name: Build firmware (release) and check stack frames
        run: tools/check.sh stack-frames
