name: Release firmware images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install Rust (stable, firmware target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add riscv32imc-unknown-none-elf --toolchain stable

      - name: Install espflash
        run: CARGO_BUILD_TARGET=x86_64-unknown-linux-gnu cargo install espflash --locked

      # A run from a branch would release under the branch's name and make it
      # Latest, and a tag pushed without tools/prepare-release.sh would ship
      # images stamped with the previous version.
      - name: Check the tag names this build
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "error: releases are built from a v* tag, not the $GITHUB_REF_TYPE $GITHUB_REF_NAME" >&2
            exit 1
          fi
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' fw/Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "error: tag $GITHUB_REF_NAME, but fw/Cargo.toml says $version; run tools/prepare-release.sh" >&2
            exit 1
          fi

      - name: Build X4 release images
        run: tools/build-release.sh x4

      - name: Build X3 release images
        run: tools/build-release.sh x3

      - name: Assemble public release assets
        run: |
          mkdir -p target/public-release
          cp target/release-images/firmware.bin target/public-release/firmware-x4.bin
          cp target/release-images/firmware-x3.bin target/public-release/firmware-x3.bin
          cp target/release-images/update.bin target/public-release/update.bin
          cp target/release-images/update-x3.bin target/public-release/update-x3.bin
          cp target/release-images/update.bin target/public-release/FWUPDATE.BIN
          cp target/release-images/FWUPDX3.BIN target/public-release/FWUPDX3.BIN

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            target/public-release/firmware-x4.bin \
            target/public-release/firmware-x3.bin \
            target/public-release/update.bin \
            target/public-release/update-x3.bin \
            target/public-release/FWUPDATE.BIN \
            target/public-release/FWUPDX3.BIN \
            --title "${GITHUB_REF_NAME}" \
            --notes "CalendulaOS ${GITHUB_REF_NAME} firmware images for Xteink X4 and X3."

      - name: Publish release firmware to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -f release_tag="${GITHUB_REF_NAME}"
