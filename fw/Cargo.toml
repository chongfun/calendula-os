[package]
name = "fw"
version = "0.6.0"
edition = "2021"
default-run = "fw"

[lints]
workspace = true

[features]
default = ["serial-log"]
# `bench:` telemetry and per-refresh driver chatter (fw::log's bench_log!).
# Default ON: tools/bench/bench.py parses these lines and every existing
# workflow expects them, so the default build is byte-for-byte the old
# behavior. Disable for a shipped untethered build — with no USB host there
# is no SOF, and each print blocks at 115200 baud inside a critical section.
# Error, panic, and boot-identity output is NOT behind this feature.
#
# Scope, so the saving is not overstated: this covers the six lines a steady
# reading page turn emits (~418 B, ~36 ms untethered) and the per-refresh
# driver chatter. It does NOT yet cover the SD session's per-call lines
# (~7 per session, so an SD-touching turn still prints) or most of
# book_build's build chatter, and fw still hard-enables reader-cache/esp-log.
# So a cold build or boot is only partly reduced. Extending it is mechanical;
# the seam is what needed to exist first.
serial-log = []
# Temporary on-device validation of the flash + otadata path without an SD card:
# on first boot, copy the running image into the inactive slot and switch
# otadata to it. Never enabled in a release build. See fw::ota_update.
ota-selftest = []
# On-device abrupt-reset campaign for the install durability gate:
# auto-starts the wireless session on boot (so cut/reboot/verify cycles run
# unattended) and adds POST /test-powercut?after_ms=N, which arms the RTC
# watchdog and never feeds it — the reset fires from RTC hardware even
# inside a blocking SD write. Approximates a power cut for write-ordering
# validation; SD card power stays up, so card-level power-loss physics
# still need the bench rig. Never enabled in a release build.
# See fw::powercut and tools/powercut_campaign.py.
powercut-selftest = []
# Device-driven bench scenarios: presses buttons from a task so a timing
# capture runs unattended, with cadence taken from the settle rather than a
# host timer. bench.py only listens, so every suite has been operator-driven
# and the operator has been inside the measurement. An injected press enters
# at INPUT_EVENTS and so skips the ADC sample and debounce a real one clears;
# calibrate that offset against a hand-pressed run before quoting a number
# from this path. Never enabled in a release build.
# See fw::bench_selftest and docs/agents/bench.md.
bench-selftest = []
# Build for the Xteink X3 (792x528 UC8253 panel, BQ27220 battery gauge).
# Off = Xteink X4, the default. See docs/plans/2026-07-06-x3-support-plan.md.
device-x3 = ["display/device-x3", "reader-cache/device-x3"]
# Compile a generated custom typeface into firmware. Requires
# display/src/custom_generated.rs, produced by tools/font_pack_to_rust.py.
builtin-custom-font = ["display/builtin-custom-font"]

[dependencies]
app-core = { path = "../app-core" }
display = { path = "../display" }
ui = { path = "../ui" }
proto = { path = "../proto" }
hal-ext = { path = "../hal-ext" }
upload-store = { path = "../upload-store" }
reader-cache = { path = "../reader-cache", features = ["esp-log"] }

embassy-executor  = "0.10.0"
embassy-time      = "0.5.1"
embassy-sync      = "0.8.0"
embassy-futures   = "0.1.1"
esp-hal           = { version = "1.1.1", features = ["esp32c3", "unstable"] }
esp-rtos          = { version = "0.3.0", features = ["esp32c3", "embassy", "esp-radio", "esp-alloc"] }
embedded-hal-async = "1.0.0"
embedded-hal       = "1.0.0"
# Our fork, now on upstream v0.10 — which carries the later SD rewrites the
# previous #210 pin was avoiding. Those were reported to fail cold card init
# on the X4 ("sd: session failed: CardInit", July 4 2026), upstream's board;
# this project has only X3 hardware, and the X3 has been verified against this
# revision. See [workspace.dependencies] in the root manifest for the fork and
# what it changes.
embedded-sdmmc     = { workspace = true }
nb                = "1.1.0"
portable-atomic   = { version = "1.10.0", features = ["unsafe-assume-single-core"] }
static_cell       = "2.1.0"
heapless          = "0.9.0"
esp-println       = { version = "0.17.0", features = ["esp32c3"] }
esp-radio         = { version = "1.0.0-beta.0", features = ["esp32c3", "wifi", "unstable"] }
esp-alloc         = "0.10.0"
embassy-net       = { version = "0.9.1", features = ["proto-ipv4", "tcp", "udp", "dns", "dhcpv4", "medium-ethernet"] }
# Prints registers + backtrace over USB on CPU exceptions, then halts in
# place instead of silently resetting. Keep: crash evidence beats reboots.
esp-backtrace     = { version = "0.19.0", features = ["esp32c3", "println", "panic-handler"] }
esp-storage = { version = "0.9.0", features = ["esp32c3"] }
embedded-storage = "0.3.1"
